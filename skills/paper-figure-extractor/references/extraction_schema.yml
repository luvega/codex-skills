version: 1
purpose: Canonical schema for paper figure extraction cards and summary tables.

source_status_values:
  - explicit in caption/text
  - visible in page image
  - user observation
  - inferred
  - not reported in PDF

confidence_values:
  - high
  - medium
  - low
  - not applicable

required_card_fields:
  source:
    paper_id: ""
    citation: ""
    doi: ""
    figure_panel: ""
    pdf_path: ""
    page_number: ""
    caption_excerpt: ""
  biological_question:
    question: ""
    comparison_direction: ""
    disease_or_context: ""
  data_type:
    primary_data_type: ""
    observation_unit: ""
    feature_unit: ""
    metadata_required: []
    matrix_or_table_shape: ""
  plot_grammar:
    plot_type: ""
    x_mapping: ""
    y_mapping: ""
    color_mapping: ""
    size_mapping: ""
    shape_mapping: ""
    facet_mapping: ""
    ordering_rule: ""
    annotation_rule: ""
  statistical_layer:
    statistical_test: "not reported in PDF"
    multiple_testing: "not reported in PDF"
    effect_size: "not reported in PDF"
    n_definition: "not reported in PDF"
    paired_or_unpaired: "not reported in PDF"
  visual_style:
    background: ""
    font: ""
    axis_style: ""
    grid_style: ""
    legend_style: ""
    point_style: ""
    line_style: ""
    label_density: ""
    panel_border: ""
  palette:
    palette_type: ""
    biological_color_logic: ""
    hex_colors_if_extractable: ""
    avoidance_rules: ""
  nature_compliance:
    figure_kind: "not assessed"
    target_width_class: "not assessed"
    panel_layout_rule: "not assessed"
    panel_label_rule: "not assessed"
    font_size_rule: "not assessed"
    axis_units_rule: "not assessed"
    accessibility_rule: "not assessed"
    image_integrity_rule: "not assessed"
    chemical_structure_rule: "not assessed"
    export_format_rule: "not assessed"
    compliance_conflicts: "not assessed"
  implementation:
    r_packages: []
    python_packages: []
    input_data_shape: ""
    preprocessing: "not reported in PDF"
    output_table: ""
  reuse:
    reusable_rule: ""
    cautions: ""
    codex_instruction: ""

